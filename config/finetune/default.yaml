preset: llama2_7b_chat
dataset: gsm8k_instructions
max_seq_length: 2048
load_in_4bit: true
lora_r: 8
lora_alpha: 8
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
warmup_steps: 5
num_train_epochs: 1
learning_rate: 2.0e-4
logging_steps: 10
weight_decay: 0.01
lr_scheduler_type: linear
seed: 1
max_examples: 500
optim: adamw_8bit
report_curve: true
allow_large: false
oom_backoff: false
