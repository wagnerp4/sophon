[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mithril"
version = "0.1.0"
description = "Utilities around Gemma 4 Hub weights (uv-managed)."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.45.0",
    "huggingface-hub>=0.28.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.50.0",
    "tqdm>=4.64.0",
]

[project.scripts]
mithril-infer = "mithril.cli.inference:main"
mithril-chat-cli = "mithril.cli.chat:main"
mithril-download-hf = "mithril.utils.download_hf_model:main"
mithril-download-hf-debug = "mithril.utils.download_hf_model:main_debug"
mithril-hf-download = "mithril.utils.hf_download_cli:main"
mithril-system-check = "mithril.utils.system_check:main"
mithril-benchmark = "mithril.eval.benchmark:main"

[project.optional-dependencies]
rag = []
rag-leann = ["leann>=0.3.7"]
tts = ["qwen-tts", "soundfile"]

[tool.setuptools]
package-dir = {"mithril" = "src"}
packages = [
    "mithril",
    "mithril.backend",
    "mithril.backend.hf",
    "mithril.backend.ollama",
    "mithril.cli",
    "mithril.context",
    "mithril.eval",
    "mithril.memory",
    "mithril.retrieval",
    "mithril.retrieval.backends",
    "mithril.utils",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
