[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orodruin"
version = "0.1.0"
description = "Utilities around Gemma 4 Hub weights (uv-managed)."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.45.0",
    "click>=8.0",
    "huggingface-hub>=0.28.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.10.1",
    "tqdm>=4.64.0",
]

[project.scripts]
orodruin-cli = "orodruin.cli.terminal:main"
orodruin-infer = "orodruin.cli.inference:main"
orodruin-chat-cli = "orodruin.cli.chat:main"
orodruin-chat-tui = "orodruin.cli.backends.textual:main"
orodruin-download-hf = "orodruin.utils.download.cli_snapshot:main"
orodruin-download-hf-debug = "orodruin.utils.download.cli_snapshot:main_debug"
orodruin-hf-download = "orodruin.utils.download.cli_hf_subprocess:main"
orodruin-system-check = "orodruin.utils.device.system_check:main"
orodruin-benchmark = "orodruin.eval.benchmark:main"
orodruin-sync-shims = "orodruin.utils.device.platform:sync_shims_main"
orodruin-finetune = "orodruin.training.finetune.cli:main"

[project.optional-dependencies]
rag = []
rag-leann = ["leann>=0.3.7"]
tts = [
    "qwen-tts",
    "soundfile",
    "pipecat-ai[kokoro]>=0.0.90",
    "kokoro-onnx>=0.5.0,<1",
    "phonemizer-fork>=3.3.0",
    "websockets>=12.0",
    "requests>=2.32.5",
]
sst = [
    "qwen-asr",
    "soundfile",
    "sounddevice",
]
tui = ["textual[syntax]>=0.80.0", "textual-plot>=0.10.0", "nvidia-ml-py>=12.0.0", "psutil>=5.9.0", "pymupdf>=1.24.0"]
finetune = ["datasets>=3.0.0", "peft>=0.14.0", "trl>=0.15.0"]
finetune-unsloth = ["unsloth"]

[tool.setuptools]
package-dir = {"orodruin" = "src"}
packages = [
    "orodruin",
    "orodruin.backend",
    "orodruin.backend.hf",
    "orodruin.backend.ollama",
    "orodruin.backend.lmstudio",
    "orodruin.cli",
    "orodruin.cli.backends",
    "orodruin.cli.flags",
    "orodruin.cli.host",
    "orodruin.cli.tui",
    "orodruin.cli.tui.screens",
    "orodruin.cli.tui.tiles",
    "orodruin.eval",
    "orodruin.eval.datasets",
    "orodruin.eval.datasets.hellaswag",
    "orodruin.integrations",
    "orodruin.integrations.obsidian",
    "orodruin.integrations.shell",
    "orodruin.processing",
    "orodruin.processing.audio",
    "orodruin.processing.audio.speech",
    "orodruin.processing.audio.speech.backends",
    "orodruin.processing.text",
    "orodruin.processing.text.context",
    "orodruin.processing.text.memory",
    "orodruin.processing.text.completion",
    "orodruin.processing.text.completion.backends",
    "orodruin.processing.text.retrieval",
    "orodruin.processing.text.retrieval.backends",
    "orodruin.utils",
    "orodruin.utils.device",
    "orodruin.utils.download",
    "orodruin.training",
    "orodruin.training.common",
    "orodruin.training.finetune",
    "orodruin.training.finetune.datasets",
    "orodruin.training.finetune.backends",
    "orodruin.training.pretraining",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
override-dependencies = [
    "transformers>=5.10.1",
]
