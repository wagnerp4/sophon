[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sophon"
version = "0.1.0"
description = "Utilities around Gemma 4 Hub weights (uv-managed)."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.45.0",
    "click>=8.0",
    "huggingface-hub>=0.28.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.10.1",
    "tqdm>=4.64.0",
]

[project.scripts]
sophon-cli = "sophon.cli.terminal:main"
sophon-infer = "sophon.cli.inference:main"
sophon-chat-cli = "sophon.cli.chat:main"
sophon-chat-tui = "sophon.cli.backends.textual:main"
sophon-download-hf = "sophon.utils.download.cli_snapshot:main"
sophon-download-hf-debug = "sophon.utils.download.cli_snapshot:main_debug"
sophon-hf-download = "sophon.utils.download.cli_hf_subprocess:main"
sophon-system-check = "sophon.utils.device.system_check:main"
sophon-benchmark = "sophon.eval.benchmark:main"
sophon-rag-index = "sophon.cli.rag_index:main"
sophon-sync-shims = "sophon.utils.device.platform:sync_shims_main"
sophon-finetune = "sophon.training.finetune.cli:main"

[project.optional-dependencies]
rag = []
rag-leann = ["leann>=0.3.7"]
rag-lightrag = ["lightrag-hku>=1.4.0"]
rag-full = ["leann>=0.3.7", "lightrag-hku>=1.4.0"]
tts = [
    "qwen-tts",
    "soundfile",
    "pipecat-ai[kokoro]>=0.0.90",
    "kokoro-onnx>=0.5.0,<1",
    "phonemizer-fork>=3.3.0",
    "websockets>=12.0",
    "requests>=2.32.5",
]
sst = [
    "qwen-asr",
    "soundfile",
    "sounddevice",
]
tui = [
    "textual[syntax]>=0.80.0",
    "textual-plot>=0.10.0",
    "nvidia-ml-py>=12.0.0",
    "psutil>=5.9.0",
    "pymupdf>=1.24.0",
    "textual-image[textual,numpy]>=0.8.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
finetune = ["datasets>=3.0.0", "peft>=0.14.0", "trl>=0.15.0"]
finetune-unsloth = ["unsloth"]

[tool.setuptools]
package-dir = {"sophon" = "src"}
packages = [
    "sophon",
    "sophon.backend",
    "sophon.backend.hf",
    "sophon.backend.ollama",
    "sophon.backend.lmstudio",
    "sophon.cli",
    "sophon.cli.backends",
    "sophon.cli.flags",
    "sophon.cli.host",
    "sophon.cli.tui",
    "sophon.cli.tui.screens",
    "sophon.cli.tui.tiles",
    "sophon.eval",
    "sophon.eval.datasets",
    "sophon.eval.datasets.hellaswag",
    "sophon.integrations",
    "sophon.integrations.obsidian",
    "sophon.integrations.zotero",
    "sophon.integrations.shell",
    "sophon.integrations.google",
    "sophon.integrations.overleaf",
    "sophon.processing",
    "sophon.processing.audio",
    "sophon.processing.audio.speech",
    "sophon.processing.audio.speech.backends",
    "sophon.processing.text",
    "sophon.processing.text.context",
    "sophon.processing.text.memory",
    "sophon.processing.text.completion",
    "sophon.processing.text.completion.backends",
    "sophon.processing.text.retrieval",
    "sophon.processing.text.retrieval.backends",
    "sophon.processing.text.retrieval.corpus",
    "sophon.cli.tui.widgets",
    "sophon.harness",
    "sophon.harness.subagent",
    "sophon.utils",
    "sophon.utils.device",
    "sophon.utils.download",
    "sophon.training",
    "sophon.training.common",
    "sophon.training.finetune",
    "sophon.training.finetune.datasets",
    "sophon.training.finetune.backends",
    "sophon.training.pretraining",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
override-dependencies = [
    "transformers>=5.10.1",
]
