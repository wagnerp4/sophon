[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmwrap"
version = "0.1.0"
description = "Utilities around Gemma 4 Hub weights (uv-managed)."
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.45.0",
    "huggingface-hub>=0.28.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.0.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.50.0",
    "tqdm>=4.64.0",
]

[project.scripts]
lmwrap-infer = "lmwrap.app.inference:main"
lmwrap-chat-cli = "lmwrap.app.chat_cli:main"
lmwrap-download-hf = "lmwrap.utils.download_hf_model:main"
lmwrap-download-hf-debug = "lmwrap.utils.download_hf_model:main_debug"
lmwrap-hf-download = "lmwrap.utils.hf_download_cli:main"
lmwrap-system-check = "lmwrap.app.system_check:main"

[tool.setuptools]
package-dir = {"lmwrap" = "src"}
packages = ["lmwrap", "lmwrap.app", "lmwrap.backend", "lmwrap.utils"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
